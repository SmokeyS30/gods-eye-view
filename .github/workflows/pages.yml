name: Redirect to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Build redirect page
        run: |
          mkdir -p site
          cat > site/index.html <<'HTMLEOF'
          <!doctype html>
          <html><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=https://daybreak-app-host-s30.eastus.cloudapp.azure.com/gev/">
          <link rel="canonical" href="https://daybreak-app-host-s30.eastus.cloudapp.azure.com/gev/">
          <title>God's Eye View</title></head>
          <body style="background:#000;color:#fff;font-family:sans-serif;text-align:center;padding-top:20vh">
          <p>Opening <a style="color:#7df" href="https://daybreak-app-host-s30.eastus.cloudapp.azure.com/gev/">God's Eye View</a>…</p>
          </body></html>
          HTMLEOF
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
