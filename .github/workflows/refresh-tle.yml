name: Refresh CelesTrak TLE cache

# The Render host cannot reach celestrak.org (egress IPs blocked), so the
# satellite proxy serves TLE data committed to .gev-cache/. This workflow
# refreshes that snapshot monthly from GitHub's runners.
on:
  schedule:
    - cron: '17 9 1 * *' # 1st of each month, 09:17 UTC
  workflow_dispatch: # manual trigger (used to verify the workflow works)

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch fresh TLE data
        run: node scripts/seed-tle-cache.mjs
        env:
          TLE_STRICT: '1'
      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .gev-cache/
          if git diff --cached --quiet; then
            echo "No TLE changes to commit."
          else
            git commit -m "Refresh CelesTrak TLE cache data"
            git push
          fi
